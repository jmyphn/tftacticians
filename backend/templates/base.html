<!doctype html>
<title>{% block title %}{% endblock %} - TFTacticians</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit&family=Montserrat&family=Open+Sans:wght@500&display=swap"
    rel="stylesheet">

<body>
    <div class="top-glow"></div>
    <div class="full-body-container">
        <div class="top-text">
            <div class="logo-wrapper">
                <div class="logo-container">
                    <svg xmlns="http://www.w3.org/2000/svg" width="600" height="120">
                        <defs>
                            <linearGradient id="gold-gradient" x1="0%" y1="0%" x2="100%" y2="0">
                                <stop offset="0%" style="stop-color:#C89B3C;" />
                                <stop offset="50%" style="stop-color:#F0E6D2;" />
                                <stop offset="100%" style="stop-color:#C89B3C;" />
                            </linearGradient>

                            <pattern id="pattern" x="0" y="0" width="300%" height="100%" patternUnits="userSpaceOnUse">
                                <rect x="0" y="0" width="150%" height="100%" fill="url(#gold-gradient)">
                                    <animate attributeType="XML" attributeName="x" from="0" to="150%" dur="7s"
                                        repeatCount="indefinite" />
                                </rect>
                                <rect x="-150%" y="0" width="150%" height="100%" fill="url(#gold-gradient)">
                                    <animate attributeType="XML" attributeName="x" from="-150%" to="0" dur="7s"
                                        repeatCount="indefinite" />
                                </rect>
                            </pattern>
                        </defs>
                        <text x="50%" y="65%" text-anchor="middle" fill="url(#pattern)" stroke="#785A28"
                            stroke-width="2" font-family="'Futura', 'Arial Black', sans-serif" font-weight="bold"
                            font-size="75px">TFTacticians</text>
                    </svg>
                </div>
                <div class="pengu-container">
                    <img src="{{ url_for('static', filename='images/pengu.png') }}" alt="Pengu" class="pengu-image">
                </div>
            </div>
            <div class="input-box" onclick="sendFocus()">
                <img src="{{ url_for('static', filename='images/mag.png') }}" />
                <input id="filter-text-val">
                <span class="placeholder-text">Enter a <span class="typewriter-text"></span></span>
                <button id="search-button" class="search-button">
                    <span>Search</span>
                </button>
            </div>
            <div id="loading-container" class="loading-container">
                <div class="lds-ring">
                    <div></div>
                    <div></div>
                    <div></div>
                    <div></div>
                </div>
            </div>
        </div>
        <div id="answer-box">
        </div>
    </div>

    <script>
        function answerBoxTemplate(champion) {
            const name = champion.name;
            const traits = champion.traits;
            const lore = champion.lore || "No lore available.";
            const score = champion.score || 0;
            const best5Champions = champion.best_5_champions || [];
            const tags = champion.tags || [];

            let tagsHTML = "";
            if (tags.length) {
                tagsHTML = `
        <div class="champion-tags-container">
          <span class="tags-label">Tags:</span>
          <div class="champion-tags">
            ${tags.map(tag => `<span class="tag">${tag}</span>`).join("")}
          </div>
        </div>`;
            }

            let traitsHTML = "";
            for (let i = 0; i < traits.length; i++) {
                traitsHTML += `<div class="trait">${traits[i].name}</div>`;
                traitsHTML += `<div class="trait-desc">${traits[i].description}</div>`;
            }

            const starRating = (score >= 1 && score <= 5)
                ? Math.round(score)
                : Math.min(5, Math.max(1, Math.round(score)));
            let starsHTML = "";
            for (let i = 0; i < 5; i++) {
                starsHTML += (i < starRating)
                    ? `<span class="star filled">★</span>`
                    : `<span class="star">☆</span>`;
            }

            let pairedChampionsHTML = "";
            if (best5Champions.length > 0) {
                pairedChampionsHTML = `
        <div class="paired-champions">
          <div class="paired-champions-title">Players most commonly pair with:</div>
          <div class="paired-champions-list">
            ${best5Champions.slice(0, 3)
                        .map(champ => `<span class="paired-champion">${champ.name}</span>`)
                        .join('')}
          </div>
        </div>`;
            }

            const championNameMapping = {
                "Aurelion Sol": "AurelionSol",
                "Cho'Gath": "Chogath",
                "Dr. Mundo": "DrMundo",
                "Jarvan IV": "Jarvan",
                "Kai'Sa": "Kaisa",
                "Kha'Zix": "Khazix",
                "Kog'Maw": "KogMaw",
                "Lee Sin": "LeeSin",
                "Master Yi": "MasterYi",
                "Miss Fortune": "MissFortune",
                "Nunu & Willump": "Nunu",
                "Rek'Sai": "RekSai",
                "Renata Glasc": "Renata",
                "Tahm Kench": "TahmKench",
                "Twisted Fate": "TwistedFate",
                "Xin Zhao": "XinZhao",
                "Leblanc": "LeBlanc"
            };

            let imagePath = championNameMapping[name]
                ? `${championNameMapping[name]}.png`
                : `${name.replace(/[^a-zA-Z0-9]/g, '')}.png`;

            return `
    <div class="card-container">
        <div class="card">
            <div class="card-front">
                <!-- Name appears above the image with minimal spacing -->
                <div class="answer-name">${name}</div>

                ${tagsHTML}

                <div class="champion-image">
                    <img src="/static/images/tft-champion/${imagePath}"
                         alt="${name}"
                         onerror="this.src='/static/images/pengu.png'">
                </div>

                <div class="champion-info">
                    <!-- Rating container with label -->
                    <div class="rating-container">
                        <div class="rating-label">Compatibility rating:</div>
                        <div class="star-rating">${starsHTML}</div>
                    </div>
                    ${pairedChampionsHTML}
                </div>
            </div>
            <div class="card-back">
                <!-- Ensure name is at the top of the back -->
                <div class="answer-name">${name}</div>
                <div class="lore-description">${lore}</div>
                <div class="answer-traits">
                    ${traitsHTML}
                </div>
            </div>
        </div>
    </div>`;
        }


        function sendFocus() {
            document.getElementById('filter-text-val').focus()
        }

        function filterText() {
            document.getElementById("answer-box").innerHTML = "";
            const loadingContainer = document.getElementById('loading-container');
            const searchQuery = document.getElementById("filter-text-val").value;

            loadingContainer.style.display = 'flex';

            fetch("/champions?" + new URLSearchParams({ query: searchQuery }).toString())
                .then((response) => response.json())
                .then((data) => {
                    const lorePromises = data.map(champion =>
                        fetch("/champion-lore?" + new URLSearchParams({
                            name: champion.name
                        }).toString())
                            .then(response => response.json())
                            .then(loreData => {
                                champion.lore = loreData.lore || "No lore available.";
                                return champion;
                            })
                    );

                    return Promise.all(lorePromises).then(() => data);
                })
                .then((championsWithLore) => {
                    championsWithLore.forEach(champion => {
                        let tempDiv = document.createElement("div");
                        tempDiv.innerHTML = answerBoxTemplate(champion);
                        document.getElementById("answer-box").appendChild(tempDiv);
                    });

                    document.querySelectorAll('.card-container').forEach(card => {
                        card.addEventListener('click', function () {
                            this.querySelector('.card').classList.toggle('flipped');
                        });
                    });

                    loadingContainer.style.display = 'none';
                })
                .catch(error => {
                    console.error('Error during search:', error);
                    loadingContainer.style.display = 'none';
                });

            const input = document.getElementById('filter-text-val');
            const placeholder = document.querySelector('.placeholder-text');
            placeholder.style.display = input.value ? 'none' : 'inline-block';
        }

        document.getElementById('search-button').addEventListener('click', filterText);

        document.getElementById('filter-text-val').addEventListener('keypress', function (event) {
            if (event.key === 'Enter') {
                filterText();
            }
        });

        const typewriterElement = document.querySelector('.typewriter-text');
        const words = ['champion', 'class', 'playstyle'];
        let wordIndex = 0;
        let charIndex = 0;
        let isDeleting = false;
        let isEnd = false;

        function typeEffect() {
            const currentWord = words[wordIndex];
            const currentChar = currentWord.substring(0, charIndex);
            typewriterElement.textContent = currentChar;
            typewriterElement.classList.remove('blinking');

            if (!isDeleting && charIndex < currentWord.length) {
                charIndex++;
                setTimeout(typeEffect, 100);
            } else if (isDeleting && charIndex > 0) {
                charIndex--;
                setTimeout(typeEffect, 50);
            } else {
                isDeleting = !isDeleting;
                typewriterElement.classList.add('blinking');
                if (!isDeleting) {
                    wordIndex = (wordIndex + 1) % words.length;
                }
                setTimeout(typeEffect, isDeleting ? 1000 : 500);
            }
        }

        document.getElementById('filter-text-val').addEventListener('input', function () {
            const placeholder = document.querySelector('.placeholder-text');
            placeholder.style.display = this.value ? 'none' : 'inline-block';
        });

        window.addEventListener('load', function () {
            typeEffect();

            document.getElementById('loading-container').style.display = 'none';

            const isLightMode = localStorage.getItem('lightMode') === 'true';
            if (isLightMode) {
                document.body.classList.add('light-mode');
                updateToggleIcon(true);
            }
        });

        document.getElementById('filter-text-val').addEventListener('focus', function () {
            const placeholder = document.querySelector('.placeholder-text');
            placeholder.style.display = 'none';
        });

        document.getElementById('filter-text-val').addEventListener('blur', function () {
            const placeholder = document.querySelector('.placeholder-text');
            placeholder.style.display = this.value ? 'none' : 'inline-block';
        });

        function toggleTheme() {
            document.body.classList.toggle('light-mode');

            const isLightMode = document.body.classList.contains('light-mode');
            localStorage.setItem('lightMode', isLightMode);

            updateToggleIcon(isLightMode);
        }

        function updateToggleIcon(isLightMode) {
            const toggleIcon = document.querySelector('.theme-toggle svg');

            if (isLightMode) {
                toggleIcon.innerHTML = `<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>`;
            } else {
                toggleIcon.innerHTML = `<circle cx="12" cy="12" r="5"></circle>
    <line x1="12" y1="1" x2="12" y2="3"></line>
    <line x1="12" y1="21" x2="12" y2="23"></line>
    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
    <line x1="1" y1="12" x2="3" y2="12"></line>
    <line x1="21" y1="12" x2="23" y2="12"></line>
    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>`;
            }
        }
    </script>

    <div class="theme-toggle" onclick="toggleTheme()">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
    </div>
</body>
